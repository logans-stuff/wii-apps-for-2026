; Nintendo Wii (libogc / devkitPPC) - the portduino node, built like
; [env:native-wasm] but with devkitPPC instead of emcc. Defines both
; ARCH_PORTDUINO_WASM (the firmware's single-threaded / no-YAML / continuous-RX
; paths, which are exactly what the Wii needs) and ARCH_PORTDUINO_WII.
; Lives in the wii-sonoran repo (apps/meshtasticd) and is copied into a
; firmware checkout by apps/meshtasticd/build.sh.
;
; Build:  pio run -e native-wii   ->  .pio/build/native-wii/meshtasticd.{elf,dol}
[env:native-wii]
platform = symlink:///w/apps/meshtasticd/platform-wii
framework = arduino
board = wii
board_dir = /w/apps/meshtasticd/platform-wii/boards
board_level = extra

build_unflags = -Wl,-Map,"${platformio.build_dir}"/output.map

build_flags = ${arduino_base.build_flags}
  -I variants/native/portduino
  -I src/platform/portduino
  ; FIRST: stubs shadow <argp.h> and <emscripten.h>
  -I src/platform/portduino/wii/stubs
  -I src/platform/portduino/wii/include
  -I src/platform/portduino/wii
  -D ARCH_PORTDUINO
  -D ARCH_PORTDUINO_WASM
  -D ARCH_PORTDUINO_WII
  -DRADIOLIB_EEPROM_UNSUPPORTED
  -fexceptions
  -include sys/time.h
  -DHAS_SCREEN=0
  ; MUI (device-ui, LVGL) on the TV - flags as [env:native-fb], 16-bit for the YUYV LUT
  -DHAS_TFT=1
  -DUSE_WII_DISPLAY=1
  -DVIEW_320x240
  -DRAM_SIZE=8192
  -DLV_COLOR_DEPTH=16
  -DLV_BUILD_TEST=0
  -DLV_USE_LOG=0
  -DLV_LVGL_H_INCLUDE_SIMPLE
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_COMP_CONF_INCLUDE_SIMPLE
  -DUSE_LOG_DEBUG
  -DLOG_DEBUG_INC=\"DebugConfiguration.h\"
  -DUSE_PACKET_API
  -DMAP_FULL_REDRAW
  -DMESHTASTIC_EXCLUDE_SCREEN=1
  -DMESHTASTIC_EXCLUDE_GPS=1 -DNO_GPS=1 -DNO_EXT_GPIO=1
  -DMESHTASTIC_EXCLUDE_I2C=1
  -DMESHTASTIC_EXCLUDE_ACCELEROMETER=1 -DMESHTASTIC_EXCLUDE_MAGNETOMETER=1
  -DMESHTASTIC_EXCLUDE_AUDIO=1 -DMESHTASTIC_EXCLUDE_INPUTBROKER=1
  -DMESHTASTIC_EXCLUDE_MQTT=1 -DMESHTASTIC_EXCLUDE_TZ=1
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1 -DMESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
  -DMESHTASTIC_EXCLUDE_EXTERNALNOTIFICATION=1 -DMESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
  -DMESHTASTIC_EXCLUDE_STOREFORWARD=1 -DMESHTASTIC_EXCLUDE_SERIAL=1
  -DMESHTASTIC_EXCLUDE_PAXCOUNTER=1 -DMESHTASTIC_EXCLUDE_WAYPOINT=1
  -DMESHTASTIC_EXCLUDE_RTTTL=1
  ; the patched libogc usb.c (ogc_usb.o, built by build.sh) wins over libogc's
  -Wl,/w/apps/meshtasticd/build/ogc_usb.o
  ; exit() reports and pauses before returning to the loader (portduino_main_wii.cpp)
  -Wl,--wrap=exit

lib_ldf_mode = chain+
lib_deps =
  ${env.lib_deps}
  ${radiolib_base.lib_deps}
  # renovate: datasource=git-refs depName=meshtastic/Crypto packageName=https://github.com/meshtastic/Crypto gitBranch=main
  https://github.com/meshtastic/Crypto/archive/1c817c2f27aa4593e07d0f7e13b3dbf8d980bcae.zip
  # renovate: datasource=custom.pio depName=Melopero RV3028 packageName=melopero/library/Melopero RV3028
  melopero/Melopero RV3028@1.2.0

lib_ignore =
  LovyanGFX
  SD

; [env:native-wasm]'s curated source set with the Wii platform dir in place of
; the wasm one.
build_src_filter =
  -<*>
  +<main.cpp>
  +<PowerFSM.cpp> +<Power.cpp> +<airtime.cpp> +<sleep.cpp>
  +<RedirectablePrint.cpp> +<SerialConsole.cpp> +<Observer.cpp>
  +<FSCommon.cpp> +<SafeFile.cpp> +<MessageStore.cpp> +<meshUtils.cpp> +<UptimeClock.cpp>
  +<memGet.cpp> +<memory/> +<GpioLogic.cpp> +<PowerMon.cpp> +<SPILock.cpp>
  +<xmodem.cpp> +<DisplayFormatters.cpp>
  +<detect/ScanI2C.cpp> +<detect/ScanI2CTwoWire.cpp> +<detect/ScanI2CConsumer.cpp>
  +<power/PowerHAL.cpp>
  +<gps/RTC.cpp>
  +<buzz/buzz.cpp> +<buzz/BuzzerFeedbackThread.cpp>
  +<mesh/*.cpp> +<mesh/*.c>
  -<mesh/LR20x0Interface.cpp>
  +<mesh/generated/>
  +<concurrency/>
  +<platform/portduino/PortduinoGlue.cpp> +<platform/portduino/SimRadio.cpp>
  +<platform/portduino/wii/>
  +<graphics/tftSetup.cpp> +<mesh/api/PacketAPI.cpp>
  +<modules/> -<modules/esp32/>
